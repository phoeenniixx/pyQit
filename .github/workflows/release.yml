name: Build wheels and publish to PyPI

on:
  release:
    types: [published]

jobs:
  check_tag:
    name: Check tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify release tag matches pyproject.toml and is new on PyPI
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          GH_TAG_NAME="${TAG#v}"
          PY_VERSION=$(python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data.get("project").get("version"))
          PY
          )
          if [ "${GH_TAG_NAME}" != "${PY_VERSION}" ]; then
            echo "::error::Tag (${GH_TAG_NAME}) does not match pyproject.toml version (${PY_VERSION})."
            exit 2
          fi
          if curl -sf "https://pypi.org/pypi/pyqit/${PY_VERSION}/json" > /dev/null; then
            echo "::error::pyqit ${PY_VERSION} is already on PyPI."
            exit 2
          fi

  pytest-nosoftdeps:
    name: no-softdeps
    needs: check_tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: pip install ".[dev]"

      - name: Run pytest
        shell: bash
        run: python -m pytest

  pytest-qiskit:
    name: qiskit-plugin
    needs: check_tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install ".[dev,qiskit]"

      - name: Run pytest
        run: python -m pytest

  build_wheels:
    needs: [pytest-nosoftdeps, pytest-qiskit]
    name: Build wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Build wheel
        run: |
          uv build --wheel --sdist --out-dir wheelhouse
          uvx twine check wheelhouse/*
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Store wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: wheelhouse/*

  upload_wheels:
    name: Upload wheels to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels]
    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: wheelhouse

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
